function stepPlayer(dt,mx,mz,jump,sprint){
 var sp=sprint?7.5:4.6,s=Math.sin(P.yaw),c=Math.cos(P.yaw);
 var wx=(mx*c+mz*s)*sp,wz=(-mx*s+mz*c)*sp; // mz: 前=-1
 var ox=P.x,oz=P.z;
 var nx=P.x+wx*dt;if(!colsHit(nx,P.z,P.y))P.x=nx;
 var nz=P.z+wz*dt;if(!colsHit(P.x,nz,P.y))P.z=nz;
 var gh=groundH(P.x,P.z);
 if(jump&&P.on){P.vy=7;P.on=false;}
 P.vy=Math.max(-30,P.vy-20*dt);
 var ny=P.y+P.vy*dt,wasOn=P.on,glue=(wasOn&&P.vy<=0)?.4:0;P.on=false;
 if(ny<=gh+glue){if(!wasOn&&P.vy<-8)snd.step();P.y=gh;P.vy=0;P.on=true;}else P.y=ny;
 if(P.y<-45){P.x=0;P.y=0;P.z=8;P.vy=0;}
 P.x=Math.max(-58,Math.min(58,P.x));P.z=Math.max(-58,Math.min(58,P.z));
 var moved=Math.hypot(P.x-ox,P.z-oz)/dt;

}

  var mx=joy.x,mz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  P.yaw+=((keys.KeyA||keys.ArrowLeft?1:0)-(keys.KeyD||keys.ArrowRight?1:0))*2*dt;
  var l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
  stepPlayer(dt,mx,mz,keys.Space||jumpBtn,keys.ShiftLeft||keys.ShiftRight);
 }
 camera.position.set(P.x,P.y+1.6+(P.on?Math.sin(bob)*.03:0),P.z);camera.rotation.set(P.pitch,P.yaw,0);camera.updateMatrixWorld();
 // 光（影つきの太陽。深い穴の底は暗くなる）
 var f=Math.max(.15,Math.min(1,1+(P.y+1)/10));
 hemi.intensity=.4*f+.05;
 sun.position.set(P.x+30,P.y+50,P.z+20);sun.target.position.set(P.x,P.y,P.z);
 _bg.copy(DARK).lerp(HORIZ,f);scene.background.copy(_bg);scene.fog.color.copy(_bg);scene.fog.near=f<.5?4:35;scene.fog.far=f<.5?34:120;
 skyM.uniforms.bot.value.copy(_bg);skyM.uniforms.top.value.copy(DARK).lerp(TOPC,f);sky.position.copy(camera.position);
 // 狙い
 var target='none',sh=null,shKind=null,th=null,oh=null;
 if(play){
  _ray.setFromCamera(touchMode||locked?_c0:mouse,camera);_ray.far=4.5;_dir.copy(_ray.ray.direction);_o.copy(_ray.ray.origin);
  sh=aimStone();
  if(sh){target='stone';shKind=sh.object===PL.wash.mesh?'wash':'polish';}
  else{
   th=terrainRay(_o,_dir,6);oh=oreRay(_o,_dir,6);
   if(oh&&(!th||oh.t<=th.t+.3)){target='ore';}
   else if(th&&inDigField(th.x,th.z)){target='terrain';}
  }
  window.__tgt=target+':'+shKind;var tool=target==='stone'?(shKind==='wash'?'wash':'polish'):'dig';
  pickG.visible=tool==='dig';clothM.visible=tool==='polish';
  for(var wi=0;wi<toolWash.length;wi++)toolWash[wi].visible=tool==='wash'&&wi===S.wash;
  if(acting){
   if(target==='stone'){
    var T2=PL[shKind];_lp.copy(sh.point);T2.mesh.worldToLocal(_lp);
    if(shKind==='wash'){var W=WASHERS[S.wash];washAt(_lp,W.rate*dt,sh.point);toolWash[S.wash].position.x=.28+Math.sin(performance.now()*.02)*.04;}
    else{polishAt(_lp,(1.4+.45*S.cloth)*dt);clothM.position.x=.18+Math.sin(performance.now()*.02)*.05;}
   }else if(target==='ore'){hitT-=dt;if(hitT<=0){hitT=.24;hitOre(oh.ore);}}
   else if(target==='terrain'){hitT-=dt;if(hitT<=0){hitT=.24;digHit(th);}}
  }else hitT=0;
 }
 if(target==='terrain'){var stp=Math.min(1,PICKS[S.pick].pow/(.34*LAYERS[layerAtDepth(-heightAt(th.x,th.z))].hp));ring.position.set(th.x,th.y+.06,th.z);ring.scale.setScalar(1.5+.6*stp);ring.material.color.setHex(0xffffff);ring.visible=true;}
 else if(target==='ore'){ring.position.set(oh.ore.x,oh.ore.y+.1,oh.ore.z);ring.scale.setScalar(.7);ring.material.color.setHex(0xffc040);ring.visible=true;}
 else ring.visible=false;
 if(swing>0)swing=Math.max(0,swing-dt*5);
 pickG.rotation.x=.2-swing;
 ['polish','wash'].forEach(function(k){var m=PL[k].mesh;if(m){m.rotation.y+=dt*(acting&&target==='stone'&&shKind===k?.25:.4);var s2=m.material.userData.sh;if(s2)s2.uniforms.uTime.value=T;}});
 grassU.uTime.value=T;
 for(var i=parts.length-1;i>=0;i--){var m=parts[i],u=m.userData;u.life-=dt;u.v.y-=14*dt;m.position.addScaledVector(u.v,dt);m.scale.setScalar(Math.max(.01,u.life*1.4));
  if(u.life<=0){scene.remove(m);parts.splice(i,1);}}
 if(S.reqOn&&S.reqs.length<3){reqTimer-=dt;if(reqTimer<=0){reqTimer=25+Math.random()*20;genReq();}}
 infoT-=dt;
 if(infoT<=0){infoT=.1;
  var dep=Math.max(0,Math.floor(-P.y));
  document.getElementById('depth').textContent='⬇ '+dep+'m（'+LAYERS[layerAtDepth(dep)].n+'）';
  var ns=play?nearStation():null;
  if(ns){promptEl.style.display='block';promptEl.textContent='E：'+ns.n+'を開く';}
  else if(play&&P.y<-1.5){promptEl.style.display='block';promptEl.textContent='R：地上へ戻る';}
  else promptEl.style.display='none';
  var dw=Math.hypot(P.x-WASHP.x,P.z-WASHP.z),dp=Math.hypot(P.x-BENCH.x,P.z-BENCH.z),k2=dw<dp?'wash':'polish',st=stOf(k2);
  if(st&&Math.min(dw,dp)<6){
   var s=stats(st),ov=s.over>.005,head='<b style="color:'+QUAL[st.q].col+'">'+sname(st)+'</b>（平均の×'+ratio(st).toFixed(2)+'）<br>';
   infoEl.style.display='block';
   if(k2==='wash')infoEl.innerHTML='🧼 <b>洗い場</b>　'+head+'汚れ '+Math.floor(s.dirt*100)+'%<div class="bar"><i style="width:'+(s.dirt*100)+'%;background:#a8703a"></i></div><small>'+WASHERS[S.wash].n+'で洗おう。汚れが落ちたら磨き台へ運ばれます</small>';
   else infoEl.innerHTML='🔧 <b>磨き台</b>　'+head+'売値 '+fmt(value(st))+'G　汚れ '+Math.floor(s.dirt*100)+'%　ツヤ '+Math.floor(s.avg*100)+'%<div class="bar"><i style="width:'+(s.avg*100)+'%;background:linear-gradient(90deg,#6ad,#fff)"></i></div>磨きすぎ '+Math.floor(s.over*100)+'%'+(ov?' ⚠':'')+'<div class="bar"><i style="width:'+Math.min(100,s.over*300)+'%;background:#e5503a"></i></div><small>同じ所をこすり続けると石がやせます</small>';
  }else infoEl.style.display='none';
 }
 saveT+=dt;if(saveT>6){saveT=0;save();}
 renderer.render(scene,camera);
}

addEventListener('resize',resize);resize();
tintPick();tintCloth();syncAll();hud();if(S.reqOn)jew.visible=true;
if(touchMode)document.querySelector('#start p').innerHTML='タップで開始<br>左スティックで移動、画面ドラッグで視点<br>右のボタンで掘る・洗う・磨く';
window.__g={P:P,S:S,H:H,ORES:ORES,STONES:STONES,PL:PL,heightAt:heightAt,dent:dent,digHit:digHit,hitOre:hitOre,mineOre:mineOre,polishAt:polishAt,washAt:washAt,place:place,syncAll:syncAll,openMenu:openMenu,earn:earn,qualifies:qualifies,stats:stats,value:value,genReq:genReq,randW:randW,randQ:randQ};
loop();
