<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ツギハギの森</title>
<style>
  html,body{margin:0;height:100%;background:#0d1210;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;background:#000;display:block}
  .pad{position:fixed;display:none;gap:6px}
  .pad button{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;font:bold 18px sans-serif;touch-action:none}
  #dpad{left:14px;bottom:14px;display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px)}
  #abtn{right:14px;bottom:14px}
  @media (pointer:coarse){ #dpad{display:grid} #abtn{display:flex} }
</style>
<script src="../../guard.js?v=d6f58c9d"></script><script src="../../notice.js?v=d6f58c9d"></script></head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas></div>
<div class="pad" id="dpad">
  <span></span><button data-k="up">▲</button><span></span>
  <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
  <span></span><button data-k="down">▼</button><span></span>
</div>
<div class="pad" id="abtn"><button data-k="cancel">B</button><button data-k="ok">A</button></div>
